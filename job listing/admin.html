<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="script.js"></script>
</head>
<body>
  <header>
    <h1>Admin Panel</h1>
    <button id="logoutBtn">Logout</button>
    <a href="index.html"><button class="public-btn">View Public Listings</button></a>
  </header>

  <section id="adminPanel">
    <h2>Add New Job</h2>
    <form id="addJobForm">
      <!-- Removed Job ID field -->
      <input type="text" id="jobTitle" placeholder="Job Title" required>
      <input type="text" id="location" placeholder="Location" required>
      <input type="text" id="experience" placeholder="Experience" required>
      <input type="text" id="salary" placeholder="Salary" required>
      <input type="url" id="jobLink" placeholder="Job Link" required>
      <button type="submit">Add Job</button>
    </form>

    <div class="delete-section">
      <h3>Delete Job</h3>
      <!-- For deletion, admin must now use the auto-generated Job ID as shown in listings -->
      <input type="text" id="deleteJobId" placeholder="Enter Job ID" />
      <button id="deleteJobBtn">Delete Job</button>
      <div id="message"></div>
    </div>
  </section>

  <section id="adminJobListings">
    <h2>Current Job Listings</h2>
    <div id="jobListingsAdmin">
      <!-- Admin view of job listings -->
    </div>
  </section>
  <!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
  <div class="modal-content">
    <p>Are you sure you want to delete this job?</p>
    <button id="confirmDelete" class="btn btn-danger">Yes, Delete</button>
    <button id="cancelDelete" class="btn btn-secondary">Cancel</button>
  </div>
</div>

<style>
  /* Modal Styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
  }
  
  .modal-content {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }

  .modal button {
    margin: 10px;
    padding: 8px 15px;
    border: none;
    cursor: pointer;
  }

  .btn-danger {
    background: red;
    color: white;
  }

  .btn-secondary {
    background: gray;
    color: white;
  }
</style>

</body>
</html>
